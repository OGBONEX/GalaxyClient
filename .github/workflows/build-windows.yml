name: Build Windows executable variants

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: win-x64-portable
            runtime: win-x64
            self_contained: true
            compression: true
          - variant: win-x64-framework-dependent
            runtime: win-x64
            self_contained: false
            compression: false
          - variant: win-x86-portable
            runtime: win-x86
            self_contained: true
            compression: true
          - variant: win-arm64-portable
            runtime: win-arm64
            self_contained: true
            compression: true
          - variant: win-x64-uncompressed
            runtime: win-x64
            self_contained: true
            compression: false
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish ${{ matrix.variant }}
        run: >-
          dotnet publish .\GalaxyClient.csproj --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained ${{ matrix.self_contained }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=${{ matrix.compression }}
          --output .\publish\${{ matrix.variant }}
      - name: Name executable variant
        run: Copy-Item ".\publish\${{ matrix.variant }}\GalaxyClient.exe" ".\publish\GalaxyClient-${{ matrix.variant }}.exe"
      - name: Upload executable variant
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyClient-${{ matrix.variant }}
          path: publish/GalaxyClient-${{ matrix.variant }}.exe
          if-no-files-found: error
          retention-days: 14
