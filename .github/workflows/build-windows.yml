name: Build Windows executable variants

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: win-x64-portable
            runtime: win-x64
            self_contained: true
            compression: true
            single_file: true
          - variant: win-x64-framework-dependent
            runtime: win-x64
            self_contained: false
            compression: false
            single_file: true
          - variant: win-x86-portable
            runtime: win-x86
            self_contained: true
            compression: true
            single_file: true
          - variant: win-arm64-portable
            runtime: win-arm64
            self_contained: true
            compression: true
            single_file: true
          - variant: win-x64-uncompressed
            runtime: win-x64
            self_contained: true
            compression: false
            single_file: true
          - variant: win-x64-folder
            runtime: win-x64
            self_contained: true
            compression: false
            single_file: false
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish ${{ matrix.variant }}
        run: >-
          dotnet publish .\GalaxyClient.csproj --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained ${{ matrix.self_contained }}
          -p:PublishSingleFile=${{ matrix.single_file }}
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=${{ matrix.compression }}
          --output .\publish\${{ matrix.variant }}
      - name: Rename executable for a unique release filename
        shell: pwsh
        run: Rename-Item ".\publish\${{ matrix.variant }}\GalaxyClient.exe" "GalaxyClient-${{ matrix.variant }}.exe"
      - name: Package folder variant
        if: ${{ !matrix.single_file }}
        shell: pwsh
        run: Compress-Archive -Path ".\publish\${{ matrix.variant }}\*" -DestinationPath ".\publish\${{ matrix.variant }}.zip"
      - name: Upload single-file executable
        if: ${{ matrix.single_file }}
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyClient-${{ matrix.variant }}
          path: publish/${{ matrix.variant }}/GalaxyClient-${{ matrix.variant }}.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload folder package
        if: ${{ !matrix.single_file }}
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyClient-${{ matrix.variant }}
          path: publish/${{ matrix.variant }}.zip
          if-no-files-found: error
          retention-days: 30

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download all six build variants
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/*/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" release-assets/*/* --title "Galaxy Client $TAG_NAME" --generate-notes --prerelease --repo "$GITHUB_REPOSITORY"
          fi
